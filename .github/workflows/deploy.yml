name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_DIR }}
            git checkout main
            git pull --rebase --autostash origin main
            docker compose up -d --build
            POSTGRES_CONTAINER=$(docker compose --profile cms ps -q postgres)
            test -n "$POSTGRES_CONTAINER"
            docker cp directus/migrate-okpo.sql "$POSTGRES_CONTAINER:/tmp/migrate-okpo.sql"
            docker exec "$POSTGRES_CONTAINER" sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /tmp/migrate-okpo.sql'
            DIRECTUS_CONTAINER=$(docker compose --profile cms ps -q directus)
            test -n "$DIRECTUS_CONTAINER"
            docker restart "$DIRECTUS_CONTAINER"
            docker image prune -f
